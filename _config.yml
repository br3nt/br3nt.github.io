# Site settings
#
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

url: 'https://br3nt.github.io'
# baseurl: 'br3nt.github.io'

title: br3nt's Stuff

email: your-email@example.com

timezone: Australia/Adelaide

description: >-
  This is a collection of random thoughts and projects in various states of completeness.

author_alias: &alias br3nt
author: &author Brent Jacobs

collections:
  code_pens:
    output: true
  games:
    output: true
  projects:
    output: true
  reviews:
    output: true
  shader_examples:
    output: true
  advent_of_code:
    output: true

defaults:
  - scope:
      path: ""
    values:
      author: *author
      author_alias: *alias
      pen_height: 500
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: code_pens
    values:
      layout: code_pen
  - scope:
      path: ""
      type: games
    values:
      layout: game
  - scope:
      path: ""
      type: projects
    values:
      layout: default
  - scope:
      path: ""
      type: reviews
    values:
      layout: post
  - scope:
      path: ""
      type: shader_examples
    values:
      layout: game
  - scope:
      path: ""
      type: advent_of_code
    values:
      layout: post

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-contentblocks

exclude:
  - README.md
  - node_modules
  - '*.config.js'
  - bin

# Feeds are hand-written Atom templates (feed.xml and feed/*.xml, sharing
# _includes/atom_feed.xml) so the root feed can merge collections and every
# feed carries all its entries. Autodiscovery links come from _data/feeds.yml
# via _layouts/base.html. bin/validate-feeds checks the built XML.
