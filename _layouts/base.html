<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta charset="UTF-8">

  {% seo %}
  {% for feed in site.data.feeds -%}
  <link rel="alternate" type="application/atom+xml" href="{{ feed.path | absolute_url }}" title="{{ site.title | append: ' | ' | append: feed.name | xml_escape }}" />
  {% endfor %}

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#157878">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

  {% ifhascontent head %}
    {% contentblock head %}
  {% endifhascontent %}
</head>

<body>
  {{ content }}
  <script>
    // inline person profiles: click the dotted name to open its card, click anywhere to close
    (function () {
      document.querySelectorAll('.person-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var parent = btn.closest('.person');
          var wasOpen = parent.classList.contains('open');
          document.querySelectorAll('.person.open, .cite.open').forEach(function (c) { c.classList.remove('open'); });
          if (!wasOpen) parent.classList.add('open');
        });
      });
      document.addEventListener('click', function () {
        document.querySelectorAll('.person.open').forEach(function (c) { c.classList.remove('open'); });
      });
    })();
  </script>
</body>

</html>
